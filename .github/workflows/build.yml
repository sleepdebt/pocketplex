# CI. Builds all three targets on push/PR and uploads artifacts.
# Desktop + unit tests run on ubuntu; the SP and MMP cross builds run in the
# Docker images from toolchains/ (host-arch independent: aarch64 / armhf cross
# compilers, so an amd64 runner produces SP and MMP binaries).
name: build
on:
  push:
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]

jobs:
  desktop:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install host build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libsdl2-dev libsdl2-ttf-dev libcurl4-openssl-dev
      - name: Build + test
        run: |
          make clean && make && make test
      - name: Upload desktop binary
        uses: actions/upload-artifact@v4
        with:
          name: pocketplex-desktop
          path: build/pocketplex
      - name: Upload pp-cli
        uses: actions/upload-artifact@v4
        with:
          name: pp-cli
          path: build/pp-cli

  sp:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build SP PortMaster zip
        run: |
          make docker-sp
      - name: Upload SP artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocketplex-sp-zip
          path: dist/pocketplex-sp.zip

  # MMP zip is NOT verified on hardware (no MMP device in this workspace;
  # blocked on core, §9 Q1). The artifact is labelled "untested" accordingly.
  mmp:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build MMP Onion zip (UNTESTED on device)
        run: |
          make docker-mmp
      - name: Upload MMP artifact (untested)
        uses: actions/upload-artifact@v4
        with:
          name: pocketplex-mmp-zip-untested
          path: dist/pocketplex-mmp.zip

  # TrimUI Brick Pro / NextUI (tg5040). Interim: no bundled mpv yet (player lane
  # pending), so the artifact is marked -nompv; HTTPS trust is the pak's pinned
  # cacert.pem via CURL_CA_BUNDLE. The toolchain image is linux/arm64, so this
  # job runs on GitHub's native arm64 runner (ubuntu-24.04-arm; amd64 runners
  # have no binfmt/QEMU registered by default and fail with "exec format error"
  # at the first RUN). setup-qemu-action on an amd64 runner is the fallback if
  # arm64 runners are ever unavailable (slower: mbedTLS+curl build emulated).
  tg5040:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build tg5040 NextUI pak zip (no mpv yet)
        run: |
          make docker-tg5040
      - name: Upload tg5040 artifact (nompv)
        uses: actions/upload-artifact@v4
        with:
          name: pocketplex-tg5040-zip-nompv
          path: dist/pocketplex-tg5040.zip
