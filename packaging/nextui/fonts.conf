<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Fonts for the Brick Pro's on-screen time label. The directory is relative to this file,
     so the pak works wherever NextUI installs it. -->
<fontconfig>
  <dir prefix="relative">assets/font</dir>
  <cachedir>/tmp/pp-fontcache</cachedir>
</fontconfig>
